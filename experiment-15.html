<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bubble Glass — 15</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; gap: 16px; cursor: none; }
    canvas { display: block; }
    #back { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.2em; color: #222; text-decoration: none; text-transform: uppercase; transition: color 0.2s; cursor: pointer; }
    #back:hover { color: #555; }
  </style>
</head>
<body>
<a id="back" href="index.html">← back</a>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script>
const IMG_FILE = 'DSCF7641.JPG';
const CANVAS_W = 900;
const CANVAS_H = 540;
const R        = 150;   // lens radius
const MAG      = 1.38;  // magnification inside lens

let img;
let offX, offY, drawW, drawH;
let lx, ly;  // smooth lens position

function preload() { img = loadImage(IMG_FILE); }

function setup() {
  pixelDensity(1);
  createCanvas(CANVAS_W, CANVAS_H);
  img.loadPixels();

  const scale = Math.min(CANVAS_W / img.width, CANVAS_H / img.height);
  drawW = img.width  * scale;
  drawH = img.height * scale;
  offX  = (CANVAS_W - drawW) / 2;
  offY  = (CANVAS_H - drawH) / 2;

  lx = CANVAS_W / 2;
  ly = CANVAS_H / 2;
}

// Sample the image at a canvas-space position, returns [r, g, b]
function sampleImg(x, y) {
  const ix = constrain(floor((x - offX) / drawW * img.width),  0, img.width  - 1);
  const iy = constrain(floor((y - offY) / drawH * img.height), 0, img.height - 1);
  const i  = (iy * img.width + ix) * 4;
  return [img.pixels[i], img.pixels[i + 1], img.pixels[i + 2]];
}

// Boost a sampled colour: push saturation away from grey, lift brightness
function amplify(r, g, b) {
  const lum = r * 0.299 + g * 0.587 + b * 0.114;
  const SAT = 2.8, LUM = 1.5;
  r = constrain(lum + (r - lum) * SAT, 0, 255) * LUM;
  g = constrain(lum + (g - lum) * SAT, 0, 255) * LUM;
  b = constrain(lum + (b - lum) * SAT, 0, 255) * LUM;
  // Clamp to 255
  const mx = max(r, g, b);
  if (mx > 255) { const s = 255 / mx; r *= s; g *= s; b *= s; }
  return [r, g, b];
}

function draw() {
  background(0);

  // Smooth lens follows mouse
  lx = lerp(lx, mouseX, 0.05);
  ly = lerp(ly, mouseY, 0.05);

  const dc = drawingContext;

  // ── Background: image dimmed ──
  push();
  tint(55);
  image(img, offX, offY, drawW, drawH);
  noTint();
  pop();

  // ── 1. Magnified image inside lens ──
  dc.save();
  dc.beginPath();
  dc.arc(lx, ly, R, 0, Math.PI * 2);
  dc.clip();
  // Scale from lens centre to magnify
  dc.translate(lx, ly);
  dc.scale(MAG, MAG);
  dc.translate(-lx, -ly);
  dc.drawImage(img.canvas ?? img.elt, offX, offY, drawW, drawH);
  dc.restore();

  // ── 2. Inner glass curvature shadow ──
  // Darker near the edge from inside — gives the lens its curved body
  const innerShadow = dc.createRadialGradient(lx, ly, R * 0.52, lx, ly, R);
  innerShadow.addColorStop(0,   'rgba(0,0,0,0)');
  innerShadow.addColorStop(0.7, 'rgba(0,0,0,0)');
  innerShadow.addColorStop(1,   'rgba(0,0,0,0.55)');
  dc.save();
  dc.beginPath();
  dc.arc(lx, ly, R, 0, Math.PI * 2);
  dc.fillStyle = innerShadow;
  dc.fill();
  dc.restore();

  // ── 3. Iridescent soap-bubble rim ──
  drawBubbleRim(dc, lx, ly, R);

  // ── 4. Cursor crosshair (tiny) ──
  push();
  stroke(255, 255, 255, 35);
  strokeWeight(0.5);
  line(lx - 7, ly, lx + 7, ly);
  line(lx, ly - 7, lx, ly + 7);
  pop();

  // ── Label ──
  push();
  textFont('Courier New');
  textSize(8);
  textAlign(LEFT, BOTTOM);
  noStroke();
  fill(255, 255, 255, 18);
  text('bubble glass — move mouse', 12, CANVAS_H - 10);
  pop();
}

function drawBubbleRim(dc, cx, cy, r) {
  const SEGS  = 180;
  const RIM_W = 20;
  const TWO_PI = Math.PI * 2;

  // ── Layer A: outer glow — sampled from just outside the lens ──
  // Amplified image colours bleed outward like light scattering through glass.
  for (let i = 0; i < SEGS; i++) {
    const a0 = (i       / SEGS) * TWO_PI;
    const a1 = ((i + 1) / SEGS) * TWO_PI + 0.02;
    const aMid = (i + 0.5) / SEGS * TWO_PI;
    // Sample the image ~half a rim-width outside the lens boundary
    const sx = cx + (r + RIM_W * 0.6) * Math.cos(aMid);
    const sy = cy + (r + RIM_W * 0.6) * Math.sin(aMid);
    const [sr, sg, sb] = amplify(...sampleImg(sx, sy));

    dc.beginPath();
    dc.arc(cx, cy, r + RIM_W * 0.3, a0, a1);
    dc.strokeStyle = `rgba(${sr|0},${sg|0},${sb|0},0.55)`;
    dc.lineWidth = RIM_W;
    dc.stroke();
  }

  // ── Layer B: inner colour bleed — sampled from just inside the lens ──
  // Picks up the magnified image colours right at the edge, adds warm glow.
  for (let i = 0; i < SEGS; i++) {
    const a0 = (i       / SEGS) * TWO_PI;
    const a1 = ((i + 1) / SEGS) * TWO_PI + 0.02;
    const aMid = (i + 0.5) / SEGS * TWO_PI;
    const sx = cx + (r - RIM_W * 0.5) * Math.cos(aMid);
    const sy = cy + (r - RIM_W * 0.5) * Math.sin(aMid);
    const [sr, sg, sb] = amplify(...sampleImg(sx, sy));

    dc.beginPath();
    dc.arc(cx, cy, r - RIM_W * 0.2, a0, a1);
    dc.strokeStyle = `rgba(${sr|0},${sg|0},${sb|0},0.35)`;
    dc.lineWidth = RIM_W * 0.6;
    dc.stroke();
  }

  // ── Layer C: thin bright inner rim line ──
  dc.beginPath();
  dc.arc(cx, cy, r - RIM_W * 0.55, 0, TWO_PI);
  dc.strokeStyle = 'rgba(255,255,255,0.14)';
  dc.lineWidth = 2;
  dc.stroke();

  // ── Layer D: thin outer rim line ──
  dc.beginPath();
  dc.arc(cx, cy, r + RIM_W * 0.5, 0, TWO_PI);
  dc.strokeStyle = 'rgba(255,255,255,0.07)';
  dc.lineWidth = 2;
  dc.stroke();

  // ── Layer E: specular highlight — bright crescent top-left ──
  dc.save();
  dc.lineCap = 'round';
  dc.beginPath();
  dc.arc(cx, cy, r - 3, -2.5, -0.65);
  dc.strokeStyle = 'rgba(255,255,255,0.78)';
  dc.lineWidth = 3.5;
  dc.stroke();
  dc.beginPath();
  dc.arc(cx, cy, r + 2, -2.5, -0.65);
  dc.strokeStyle = 'rgba(255,255,255,0.14)';
  dc.lineWidth = 9;
  dc.stroke();
  dc.restore();

  // ── Layer F: small secondary specular bottom-right ──
  dc.save();
  dc.lineCap = 'round';
  dc.beginPath();
  dc.arc(cx, cy, r - 4, 0.9, 1.7);
  dc.strokeStyle = 'rgba(255,255,255,0.2)';
  dc.lineWidth = 2.5;
  dc.stroke();
  dc.restore();
}
</script>
</body>
</html>
