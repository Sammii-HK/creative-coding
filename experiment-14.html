<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bokeh Field — 14</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; gap: 16px; cursor: none; }
    canvas { display: block; }
    #back { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.2em; color: #222; text-decoration: none; text-transform: uppercase; transition: color 0.2s; cursor: pointer; }
    #back:hover { color: #555; }
  </style>
</head>
<body>
<a id="back" href="index.html">← back</a>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script>
const IMG_FILE  = 'DSCF7641.JPG';
const CANVAS_W  = 900;
const CANVAS_H  = 540;
const NUM_BOKEH = 4000;
const CELL      = 8;
const HOVER_R   = 120;   // radius of influence around cursor

let img;
let offX, offY, drawW, drawH;
let imgColors = [];
let COLS, ROWS;

let mx = CANVAS_W / 2, my = CANVAS_H / 2;  // smooth mouse
let bokeh = [];

function preload() { img = loadImage(IMG_FILE); }

function setup() {
  pixelDensity(1);
  createCanvas(CANVAS_W, CANVAS_H);
  img.loadPixels();

  const scale = Math.min(CANVAS_W / img.width, CANVAS_H / img.height);
  drawW = img.width  * scale;
  drawH = img.height * scale;
  offX  = (CANVAS_W - drawW) / 2;
  offY  = (CANVAS_H - drawH) / 2;

  COLS = floor(CANVAS_W / CELL);
  ROWS = floor(CANVAS_H / CELL);

  for (let col = 0; col < COLS; col++) {
    imgColors[col] = [];
    for (let row = 0; row < ROWS; row++) {
      const cx = col * CELL + CELL / 2;
      const cy = row * CELL + CELL / 2;
      const ix = constrain(floor((cx - offX) / drawW * img.width),  0, img.width  - 1);
      const iy = constrain(floor((cy - offY) / drawH * img.height), 0, img.height - 1);
      const i  = (iy * img.width + ix) * 4;
      imgColors[col][row] = [img.pixels[i], img.pixels[i + 1], img.pixels[i + 2]];
    }
  }

  for (let i = 0; i < NUM_BOKEH; i++) bokeh.push(makeBokeh());
}

function makeBokeh() {
  const x = random(CANVAS_W);
  const y = random(CANVAS_H);
  const col = constrain(floor(x / CELL), 0, COLS - 1);
  const row = constrain(floor(y / CELL), 0, ROWS - 1);
  const [r, g, b] = imgColors[col][row];
  return {
    x, y,
    r, g, b,
    restSize:  random(4, 18),      // resting disc radius — large enough to overlap
    bloomSize: random(18, 36),     // bloomed radius when hovered
    vx: random(-0.06, 0.06),
    vy: random(-0.06, 0.06),
    restAlpha: random(90, 180),    // visible at rest
    // Phase offset so discs twinkle independently
    phase: random(TWO_PI),
  };
}

function draw() {
  background(0, 0, 0, 30);  // very slow fade — keeps faint ghost trails

  // Smooth mouse
  mx = lerp(mx, mouseX, 0.06);
  my = lerp(my, mouseY, 0.06);

  const t = frameCount * 0.015;

  noStroke();
  for (const p of bokeh) {
    // Drift
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -40)           p.x = CANVAS_W + 40;
    if (p.x > CANVAS_W + 40) p.x = -40;
    if (p.y < -40)           p.y = CANVAS_H + 40;
    if (p.y > CANVAS_H + 40) p.y = -40;

    // Proximity to cursor (0 = far away, 1 = right on it)
    const d = dist(p.x, p.y, mx, my);
    const prox = constrain(1 - d / HOVER_R, 0, 1);
    const smooth = prox * prox;  // ease-in so centre blooms more than edge

    // Gentle autonomous twinkle (subtle — hover is the main event)
    const twinkle = 0.5 + 0.5 * sin(t + p.phase);

    // Size: gentle grow on hover
    const sz = lerp(p.restSize, p.bloomSize, smooth * 0.5) * (1 + twinkle * 0.08);

    // Alpha: already fairly visible at rest, just nudges brighter on hover
    const alpha = lerp(p.restAlpha * (0.8 + twinkle * 0.2), min(p.restAlpha + 55, 230), smooth);

    // Colour: very subtle warm on hover
    const boost = smooth * 28;
    fill(
      min(p.r + boost, 255),
      min(p.g + boost * 0.8, 255),
      min(p.b + boost * 0.5, 255),
      alpha
    );
    circle(p.x, p.y, sz * 2);
  }

  // ── Cursor: soft glow ring ──
  push();
  noFill();
  for (let rw = HOVER_R; rw > 0; rw -= 6) {
    stroke(255, 255, 255, map(rw, HOVER_R, 0, 0, 4));
    strokeWeight(rw * 2);
    point(mx, my);
  }
  stroke(255, 255, 255, 22);
  strokeWeight(0.8);
  drawingContext.setLineDash([2, 5]);
  circle(mx, my, HOVER_R * 2);
  drawingContext.setLineDash([]);
  noStroke();
  fill(255, 255, 255, 80);
  circle(mx, my, 3);
  pop();

  // ── Label ──
  push();
  textFont('Courier New');
  textSize(8);
  textAlign(LEFT, BOTTOM);
  noStroke();
  fill(255, 255, 255, 18);
  text('bokeh field — move mouse to bloom', 12, CANVAS_H - 10);
  pop();
}
</script>
</body>
</html>
