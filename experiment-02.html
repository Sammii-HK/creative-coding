<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Codified Image — 02</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 16px;
    }
    canvas { display: block; }
    #back {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: #222;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    #back:hover { color: #555; }
  </style>
</head>
<body>
<a id="back" href="index.html">← back</a>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const IMG_FILE   = 'DSCF7641.JPG';
const CANVAS_W   = 900;
const CANVAS_H   = 540;
const CELL       = 11;        // px per grid cell — controls density vs performance
const SCAN_SPEED = 2.0;

// ─── State ───────────────────────────────────────────────────────────────────
let img;
let cellGrid = [];    // pre-computed per-cell {cx, cy, r, g, b, lum, val}
let scanX    = 0;
let phase    = 'reveal';
let holdTimer = 0;
const HOLD_FRAMES = 200;

let orbitPoints = [];

// ─── p5 ──────────────────────────────────────────────────────────────────────
function preload() {
  img = loadImage(IMG_FILE);
}

function setup() {
  pixelDensity(1);
  createCanvas(CANVAS_W, CANVAS_H);
  textFont('Courier New');
  img.loadPixels();
  buildCellGrid();
  seedOrbits();
}

// Pre-compute every cell's average color — runs once
function buildCellGrid() {
  const scale = Math.min(CANVAS_W / img.width, CANVAS_H / img.height);
  const drawW = img.width  * scale;
  const drawH = img.height * scale;
  const offX  = (CANVAS_W - drawW) / 2;
  const offY  = (CANVAS_H - drawH) / 2;

  const cols = Math.floor(CANVAS_W / CELL);
  const rows = Math.floor(CANVAS_H / CELL);

  cellGrid = [];

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const cx = col * CELL + CELL / 2;
      const cy = row * CELL + CELL / 2;

      // Map canvas cell centre → image pixel
      const imgX = Math.round((cx - offX) / drawW * img.width);
      const imgY = Math.round((cy - offY) / drawH * img.height);

      let r = 0, g = 0, b = 0;

      if (imgX >= 0 && imgX < img.width && imgY >= 0 && imgY < img.height) {
        // Average a small area for smoother values
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const ix = constrain(imgX + dx, 0, img.width - 1);
            const iy = constrain(imgY + dy, 0, img.height - 1);
            const i  = (iy * img.width + ix) * 4;
            r += img.pixels[i];
            g += img.pixels[i + 1];
            b += img.pixels[i + 2];
            n++;
          }
        }
        r = r / n; g = g / n; b = b / n;
      }

      const lum = r * 0.299 + g * 0.587 + b * 0.114;

      // Boost dark pixels so they're visible on black bg
      const boost = map(lum, 0, 255, 160, 20);
      const dr = min(r + boost, 255);
      const dg = min(g + boost, 255);
      const db = min(b + boost, 255);

      // Single hex char (0-f) — one per cell, always fits
      const hexVal = Math.round(lum / 16).toString(16);

      cellGrid.push({
        cx, cy,
        r: dr, g: dg, b: db,   // display color (boosted)
        or: r,  og: g,  ob: b, // original color (for orbits)
        lum,
        val: hexVal,
        revealFrame: -1,                              // set when scan cursor first passes
        scrambleDuration: floor(random(10, 50)),      // each cell settles at its own pace
        // Saturation for orbit picking
        sat: (() => {
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          return mx === 0 ? 0 : (mx - mn) / mx;
        })(),
      });
    }
  }
}

function seedOrbits() {
  const candidates = cellGrid
    .filter(c => c.sat > 0.2 && c.lum > 25 && c.lum < 230)
    .sort((a, b) => b.sat - a.sat);

  const chosen = [];
  for (const c of candidates) {
    if (chosen.length >= 3) break;
    const tooClose = chosen.some(o => dist(o.cx, o.cy, c.cx, c.cy) < 100);
    if (!tooClose) chosen.push(c);
  }

  orbitPoints = chosen.map((c, i) => ({
    ...c,
    rx: 20 + i * 8,
    ry: 11 + i * 4,
    speed: 0.02 * (i % 2 === 0 ? 1 : -1.3),
    phaseOff: i * TWO_PI / 3,
  }));
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  background(0);

  // ── Phase ──
  if (phase === 'reveal') {
    scanX += SCAN_SPEED;
    if (scanX >= CANVAS_W + CELL) { phase = 'hold'; holdTimer = 0; scanX = CANVAS_W + CELL; }
  } else if (phase === 'hold') {
    holdTimer++;
    if (holdTimer >= HOLD_FRAMES) phase = 'collapse';
  } else {
    scanX -= SCAN_SPEED * 1.5;
    if (scanX <= -CELL) {
      phase = 'reveal';
      scanX = -CELL;
      // Reset scramble state for next cycle with fresh random durations
      for (const c of cellGrid) {
        c.revealFrame = -1;
        c.scrambleDuration = floor(random(10, 50));
      }
    }
  }

  // Each cell has its own scrambleDuration — no constant needed here

  // ── Number grid ──
  textSize(CELL - 2);
  textAlign(CENTER, CENTER);
  noStroke();

  for (const c of cellGrid) {
    const d = c.cx - scanX;

    if (d < 0) {
      // Mark the moment this cell was first revealed
      if (c.revealFrame === -1) c.revealFrame = frameCount;

      const elapsed = frameCount - c.revealFrame;
      const a = map(c.lum, 0, 255, 120, 240);

      if (elapsed < c.scrambleDuration) {
        // Scrambling — probability of showing final value increases over time
        // so it "decelerates" into the correct char
        const settlePct = elapsed / c.scrambleDuration;
        const showFinal = random() < (settlePct * settlePct); // ease-in curve
        const ch = showFinal ? c.val : Math.floor(random(16)).toString(16);
        // Slightly brighter while scrambling
        const boost = map(elapsed, 0, c.scrambleDuration, 60, 0);
        fill(min(c.r + boost, 255), min(c.g + boost, 255), min(c.b + boost, 255), a);
        text(ch, c.cx, c.cy);
      } else {
        // Settled on final value
        fill(c.r, c.g, c.b, a);
        text(c.val, c.cx, c.cy);
      }

    } else if (d < CELL * 4) {
      // Flash at cursor edge
      const flashA = map(d, 0, CELL * 4, 255, 0);
      fill(min(c.r + 80, 255), min(c.g + 80, 255), min(c.b + 80, 255), flashA);
      text(Math.floor(random(16)).toString(16), c.cx, c.cy);
    } else {
      // Ahead of cursor: occasional ghost flicker
      if (random() < 0.004) {
        fill(c.r, c.g, c.b, 15);
        text(Math.floor(random(16)).toString(16), c.cx, c.cy);
      }
    }
  }

  // ── Scan cursor glow ──
  if (phase !== 'hold') {
    push();
    for (let gw = 16; gw > 0; gw -= 2) {
      stroke(255, 255, 255, map(gw, 16, 0, 0, 25));
      strokeWeight(gw);
      line(scanX, 0, scanX, CANVAS_H);
    }
    stroke(255, 255, 255, 140);
    strokeWeight(1);
    drawingContext.setLineDash([2, 5]);
    line(scanX, 0, scanX, CANVAS_H);
    drawingContext.setLineDash([]);
    pop();
  }

  // ── Orbits (only after scan passes them) ──
  for (const o of orbitPoints) {
    if (o.cx > scanX && phase !== 'hold') continue;

    const t  = frameCount * o.speed + o.phaseOff;
    const ox = o.cx + cos(t) * o.rx;
    const oy = o.cy + sin(t) * o.ry;

    push();
    noFill();
    stroke(o.or, o.og, o.ob, 80);
    strokeWeight(0.7);
    drawingContext.setLineDash([2, 4]);
    ellipse(o.cx, o.cy, o.rx * 2, o.ry * 2);
    drawingContext.setLineDash([]);

    // Crosshair
    stroke(o.or, o.og, o.ob, 35);
    strokeWeight(0.5);
    line(o.cx - 6, o.cy, o.cx + 6, o.cy);
    line(o.cx, o.cy - 6, o.cx, o.cy + 6);

    // Orbiting dot
    fill(o.or, o.og, o.ob, 240);
    noStroke();
    circle(ox, oy, 4.5);

    // Value label
    textSize(7.5);
    textAlign(LEFT, CENTER);
    fill(o.or, o.og, o.ob, 170);
    text(nf(o.lum / 255, 1, 2), ox + 5, oy - 2);
    pop();
  }

  // ── Horizontal guide lines (visible once mostly revealed) ──
  const revealFraction = constrain(scanX / CANVAS_W, 0, 1);
  if (revealFraction > 0.4) {
    for (const o of orbitPoints) {
      if (o.cx > scanX && phase !== 'hold') continue;
      push();
      stroke(o.or, o.og, o.ob, 45 * revealFraction);
      strokeWeight(0.5);
      drawingContext.setLineDash([3, 9]);
      line(o.cx, o.cy, CANVAS_W - 10, o.cy);
      drawingContext.setLineDash([]);
      noStroke();
      fill(o.or, o.og, o.ob, 90 * revealFraction);
      textSize(7.5);
      textAlign(RIGHT, CENTER);
      text(nf(o.lum / 255, 1, 3), CANVAS_W - 8, o.cy);
      pop();
    }
  }

  // ── Frame/state readout ──
  push();
  textSize(7.5);
  textAlign(LEFT, TOP);
  noStroke();
  fill(255, 255, 255, 20);
  text(`f:${String(frameCount).padStart(5,'0')}  x:${String(Math.round(scanX)).padStart(4,' ')}  ${phase}`, 10, 8);
  pop();
}
</script>
</body>
</html>
